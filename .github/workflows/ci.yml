name: ResumeForge checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:pdf
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pdf-regression-output
          path: client/tmp/pdfs
